name: Patchbound CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - run: npm run network:check
      - run: npm run release:verify
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - uses: actions/cache@v4
        with:
          path: ~/.cache/gltest-direct
          key: genvm-runners-v0.3.0-rc7
      - name: Prepare Direct Mode GenVM runner
        shell: bash
        run: |
          mkdir -p "$HOME/.cache/gltest-direct"
          if [ ! -f "$HOME/.cache/gltest-direct/genvm-universal-v0.3.0-rc7.tar.xz" ]; then
            curl --fail --location --retry 3 \
              https://github.com/genlayerlabs/genvm/releases/download/v0.3.0-rc7/genvm-runners-all.tar.xz \
              --output "$HOME/.cache/gltest-direct/genvm-universal-v0.3.0-rc7.tar.xz"
          fi
      - run: pytest -q
      - run: npm run build
      - name: Publish combined commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          STATUS_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            state="success"
            description="Patchbound CI passed"
          else
            state="failure"
            description="Patchbound CI failed"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$STATUS_SHA" \
            -f state="$state" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="$description" \
            -f context="Patchbound CI / combined status"
